# PromptWall CI workflow.
#
# This file lives in docs/ because the token used to push the repo did not have
# the GitHub "workflow" scope. To enable CI, move it into place:
#
#     mkdir -p .github/workflows
#     git mv docs/ci-workflow.yml .github/workflows/tests.yml
#     git commit -m "Enable CI" && git push
#
# (Or copy its contents into .github/workflows/tests.yml via the GitHub web UI.)

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
